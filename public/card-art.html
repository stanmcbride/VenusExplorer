<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venus Explorer · Card Art Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#eef2f6;font:16px/1.5 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:40px 28px}header{display:flex;justify-content:space-between;gap:24px;align-items:start;border-bottom:1px solid #343b45;padding-bottom:28px}h1{font-size:clamp(28px,4vw,46px);margin:5px 0}p{color:#aeb8c5;margin:8px 0}.eyebrow{letter-spacing:.18em;font-size:12px;color:#f2b65e;text-transform:uppercase}a{color:#e9bc79}nav{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}button{font:inherit;cursor:pointer;background:#232a34;color:#e5eaf0;border:1px solid #45515f;border-radius:8px;padding:10px 16px}button[aria-pressed=true]{background:#ecd4a6;color:#17191d;border-color:#ecd4a6}section{margin:42px 0}h2{font-size:26px;margin:0}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.option{background:#1a2029;border:1px solid #39424f;border-radius:12px;overflow:hidden}.caption{padding:16px}.caption h3{margin:0;font-size:18px}.caption p{font-size:14px;min-height:42px}.card-half{background:#211e1a;border-bottom:1px solid #5b5144}.art{width:100%;aspect-ratio:4/1;object-fit:cover;display:block;background:#252c36}.label{padding:12px 16px;border-top:3px solid var(--accent);display:flex;justify-content:space-between;gap:12px;font-weight:700}.label small{font-weight:400;color:#c1b5a3;font-size:13px}.full{display:none}.option.expanded .full{display:block;width:100%}.option.expanded .art{display:none}.option.selected{outline:2px solid var(--accent)}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{font-size:14px;padding:7px 11px}.compact .grid{grid-template-columns:repeat(auto-fit,minmax(210px,260px))}.compact .label{font-size:14px}#selection{position:sticky;bottom:14px;padding:14px 20px;background:#101820ed;border:1px solid #576573;border-radius:10px;backdrop-filter:blur(12px)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:24px 16px}.grid{grid-template-columns:1fr}header{display:block}.section-head{display:block}}
</style></head><body><main><header><div><div class="eyebrow">Venus Explorer / Visual studies</div><h1>Card artwork stripes</h1><p>Three selected directions. Three actions. Compare the artwork at card size.</p></div><a href="/">Back to game ↗</a></header><nav aria-label="View controls"><button data-filter="all" aria-pressed="true">All 9</button><button data-filter="drone" aria-pressed="false">Drone</button><button data-filter="crawler" aria-pressed="false">Crawler</button><button data-filter="bridge" aria-pressed="false">Bridge</button><button id="size" aria-pressed="false">Compact card size</button></nav><div id="gallery"></div><div id="selection" role="status">Pick a favorite for each action to compare your set.</div></main><script>
const styles=['Profile','In action','Close encounter'];
const groups=[{key:'drone',name:'Drone',accent:'#71d9ed',rule:'Explore · 6 spaces',descriptions:['A clean profile above the cloud line.','Banking through a volcanic landscape.','A close view of the scout and its sensors.','A crisp silhouette against luminous haze.','A survey view over fractured terrain.']},{key:'crawler',name:'Crawler',accent:'#eab468',rule:'Move · 3 spaces',descriptions:['Tracks and cabin in a readable side profile.','Crossing rough ground with a wake of dust.','A close view of the cockpit and heavy treads.','A bold machine outline against the horizon.','The crawler and its trail from above.']},{key:'bridge',name:'Bridge',accent:'#bbacf2',rule:'Build · 1 bridge',descriptions:['A clear span connecting two canyon rims.','The span extending across a deep chasm.','Structural detail and illuminated decking.','A striking span against volcanic light.','An overhead crossing through broken terrain.']}];
const picks={};document.getElementById('gallery').innerHTML=groups.map(g=>`<section data-group="${g.key}" style="--accent:${g.accent}"><div class="section-head"><h2>${g.name}</h2><p>Three stripe concepts · ${g.rule}</p></div><div class="grid">${styles.map((v,i)=>`<article class="option" id="${g.key}-${i+1}"><div class="card-half"><img class="art" src="/card-art/${g.key}-${i+1}.png" alt="${g.name}: ${g.descriptions[i]}"><img class="full" src="/card-art/${g.key}-${i+1}.png" alt="Full ${g.name.toLowerCase()} artwork"><div class="label"><span>${g.rule}</span><small>${g.name}</small></div></div><div class="caption"><h3>${g.name} ${i+1} · ${v}</h3><p>${g.descriptions[i]}</p><div class="controls"><button onclick="pick('${g.key}',${i+1})">Choose ${g.name} ${i+1}</button><button onclick="expand(this)" aria-expanded="false">Full artwork</button></div></div></article>`).join('')}</div></section>`).join('');
function pick(k,n){picks[k]=n;document.querySelectorAll(`[data-group="${k}"] .option`).forEach(e=>e.classList.toggle('selected',e.id===`${k}-${n}`));document.getElementById('selection').textContent=groups.map(g=>g.name+': '+(picks[g.key]?'option '+picks[g.key]:'not selected')).join('   ·   ')}function expand(b){const on=b.closest('.option').classList.toggle('expanded');b.setAttribute('aria-expanded',on);b.textContent=on?'Stripe crop':'Full artwork'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('[data-group]').forEach(s=>s.hidden=b.dataset.filter!=='all'&&s.dataset.group!==b.dataset.filter)});document.getElementById('size').onclick=function(){this.setAttribute('aria-pressed',document.body.classList.toggle('compact'))};
</script></body></html>
